<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="apple-touch-icon" href="https://spc-jp.github.io/yusuke-mikke/favicon.png">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="裕介みっけ 〜ロンドンで頑張るキミへ〜">
<meta name="twitter:description" content="朝ひらく、日本からの一言。封筒をあけると、今日のキミに届く言葉があるよ。">
<meta name="twitter:image" content="https://spc-jp.github.io/yusuke-mikke/ogp.png">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5efe0;
    --paper: #faf6ea;
    --ink: #1a2d4a;
    --accent: #c9302c;
    --gold: #b8860b;
    --shadow: rgba(0,0,0,0.15);
  }
  body {
    font-family: "游明朝", "Yu Mincho", "Hiragino Mincho ProN", "MS P明朝", serif;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,0.4) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(255,255,255,0.3) 0%, transparent 50%);
    color: var(--ink);
    min-height: 100vh;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  .wrap { width: 100%; max-width: 600px; }
  header { text-align: center; margin-bottom: 20px; }
  .title {
    font-size: 32px;
    letter-spacing: 6px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .subtitle {
    font-size: 13px;
    opacity: 0.7;
    letter-spacing: 3px;
  }
  .date {
    margin-top: 16px;
    font-size: 14px;
    color: var(--gold);
    letter-spacing: 1px;
  }

  /* 封筒 */
  .envelope-wrap {
    position: relative;
    width: 100%;
    height: 280px;
    margin: 30px 0;
    cursor: pointer;
    user-select: none;
  }
  .envelope {
    position: relative;
    width: 90%;
    max-width: 380px;
    height: 240px;
    margin: 0 auto;
    background: #fdfaf0;
    border: 2px solid var(--ink);
    box-shadow: 0 10px 30px var(--shadow);
    transition: transform 0.6s ease;
    overflow: hidden;
  }
  .envelope.opened { transform: translateY(-6px); }
  .flap {
    position: absolute;
    top: -2px;
    left: -2px;
    right: -2px;
    height: 120px;
    background: #f0e4d0;
    border: 2px solid var(--ink);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top;
    transition: transform 0.8s ease;
    z-index: 3;
  }
  .envelope.opened .flap { transform: rotateX(180deg); z-index: 1; }
  .stamp {
    position: absolute;
    top: 18px;
    right: 18px;
    width: 56px;
    height: 56px;
    border: 2px solid var(--accent);
    border-radius: 50%;
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1px;
    transform: rotate(-15deg);
    z-index: 4;
    background: rgba(253, 250, 240, 0.9);
  }
  .envelope-label {
    position: absolute;
    bottom: 46px;
    left: 0; right: 0;
    text-align: center;
    font-size: 18px;
    letter-spacing: 4px;
    z-index: 2;
  }
  .tap-hint {
    position: absolute;
    bottom: 18px;
    left: 0; right: 0;
    text-align: center;
    font-size: 12px;
    opacity: 0.6;
    z-index: 2;
    animation: pulse 2s infinite;
    letter-spacing: 2px;
  }
  .envelope.opened .tap-hint { display: none; }
  @keyframes pulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  /* 便箋 */
  .letter {
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.8s ease 0.4s;
    background: var(--paper);
    border: 1px solid rgba(0,0,0,0.1);
    padding: 36px 28px 50px;
    box-shadow: 0 5px 20px var(--shadow);
    position: relative;
    display: none;
    background-image: repeating-linear-gradient(
      to bottom, transparent, transparent 29px, rgba(26,45,74,0.08) 30px
    );
  }
  .letter.show { display: block; opacity: 1; transform: translateY(0); }
  .category-tag {
    display: inline-block;
    font-size: 11px;
    color: var(--gold);
    letter-spacing: 3px;
    border: 1px solid var(--gold);
    padding: 4px 12px;
    margin-bottom: 20px;
  }
  .message-text {
    font-size: 19px;
    line-height: 2;
    margin-bottom: 24px;
    white-space: pre-wrap;
  }
  .signature {
    text-align: right;
    font-size: 13px;
    opacity: 0.7;
    letter-spacing: 1px;
    margin-bottom: 20px;
  }
  .seal {
    position: absolute;
    bottom: 18px;
    right: 22px;
    width: 46px;
    height: 46px;
    border: 2px solid var(--accent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    font-size: 16px;
    font-weight: bold;
    transform: rotate(-10deg);
    background: rgba(250,246,234,0.8);
  }

  /* 展開ボタン */
  .toggle-row {
    display: flex;
    gap: 8px;
    margin-top: 6px;
    padding-bottom: 8px;
  }
  .toggle-btn {
    flex: 1;
    background: var(--paper);
    border: 1.5px dashed var(--gold);
    color: var(--ink);
    padding: 10px 8px;
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 1px;
    cursor: pointer;
    border-radius: 6px;
    transition: all 0.2s;
  }
  .toggle-btn:hover, .toggle-btn.active {
    background: rgba(184,134,11,0.1);
  }
  .toggle-btn.active {
    border-style: solid;
    color: var(--gold);
  }

  .extra-box {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s ease;
  }
  .extra-box.open { max-height: 500px; }
  .extra-content {
    padding: 14px 16px;
    margin-top: 10px;
    background: rgba(184,134,11,0.06);
    border-left: 3px solid var(--gold);
    border-radius: 0 6px 6px 0;
  }
  .extra-label {
    font-size: 10px;
    color: var(--gold);
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 8px;
  }
  .extra-text {
    font-size: 14px;
    line-height: 1.8;
    color: var(--ink);
  }
  .english-text {
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    color: var(--ink);
  }

  /* ボタン */
  .actions {
    display: none;
    justify-content: center;
    gap: 10px;
    margin-top: 26px;
    flex-wrap: wrap;
  }
  .actions.show { display: flex; }
  .btn {
    background: var(--paper);
    border: 1.5px solid var(--ink);
    color: var(--ink);
    padding: 10px 18px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 1px;
  }
  .btn:hover { background: var(--ink); color: var(--paper); }
  .btn.fav-on {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  /* モーダル */
  .modal {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 100;
    padding: 20px;
  }
  .modal.show { display: flex; }
  .modal-content {
    background: var(--paper);
    width: 100%;
    max-width: 500px;
    max-height: 80vh;
    overflow-y: auto;
    padding: 30px 24px;
    position: relative;
  }
  .modal-title {
    text-align: center;
    font-size: 18px;
    margin-bottom: 20px;
    letter-spacing: 2px;
  }
  .modal-close {
    position: absolute;
    top: 10px;
    right: 16px;
    background: none;
    border: none;
    font-size: 28px;
    cursor: pointer;
    color: var(--ink);
  }
  .past-item {
    border-bottom: 1px dashed rgba(0,0,0,0.2);
    padding: 14px 0;
  }
  .past-item:last-child { border-bottom: none; }
  .past-date {
    font-size: 12px;
    color: var(--gold);
    margin-bottom: 6px;
    letter-spacing: 1px;
  }
  .past-text { font-size: 14px; line-height: 1.7; }
  .empty-note {
    text-align: center;
    font-size: 14px;
    opacity: 0.6;
    padding: 30px 0;
    line-height: 1.8;
  }

  footer {
    text-align: center;
    margin-top: 50px;
    padding-top: 26px;
    border-top: 1px solid rgba(26,45,74,0.2);
  }
  .motto {
    font-size: 15px;
    letter-spacing: 4px;
    margin-bottom: 8px;
  }
  .from {
    font-size: 12px;
    color: var(--gold);
    letter-spacing: 1px;
  }

  @media (max-width: 480px) {
    .title { font-size: 26px; letter-spacing: 4px; }
    .envelope-wrap { height: 240px; }
    .envelope { height: 200px; }
    .flap { height: 100px; }
    .message-text { font-size: 17px; }
    .extra-text { font-size: 13px; }
    .toggle-btn { font-size: 11px; padding: 9px 4px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="title">裕介みっけ</h1>
    <p class="subtitle">ロンドンで頑張るキミへ</p>
    <p class="date" id="date"></p>
  </header>

  <div class="envelope-wrap" id="envelopeWrap">
    <div class="envelope" id="envelope">
      <div class="flap"></div>
      <div class="stamp">JAPAN</div>
      <div class="envelope-label">今日の一言</div>
      <div class="tap-hint">▼ タップして開く ▼</div>
    </div>
  </div>

  <article class="letter" id="letter">
    <span class="category-tag" id="categoryTag"></span>
    <p class="message-text" id="messageText"></p>
    <p class="signature" id="signature"></p>

    <div class="toggle-row">
      <button class="toggle-btn" id="toggleNote">💭 一言メモ</button>
      <button class="toggle-btn" id="toggleEng">🇬🇧 English</button>
    </div>
    <div class="extra-box" id="noteBox">
      <div class="extra-content">
        <div class="extra-label">💭 ひとこと解説</div>
        <div class="extra-text" id="noteText"></div>
      </div>
    </div>
    <div class="extra-box" id="engBox">
      <div class="extra-content">
        <div class="extra-label">🇬🇧 ENGLISH</div>
        <div class="extra-text english-text" id="engText"></div>
      </div>
    </div>

    <div class="seal">心</div>
  </article>

  <div class="actions" id="actions">
    <button class="btn" id="favBtn">☆ お気に入り</button>
    <button class="btn" id="randomBtn">🎲 もう一度引く</button>
    <button class="btn" id="pastBtn">📅 過去を見る</button>
  </div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <button class="modal-close" id="modalClose">×</button>
      <h2 class="modal-title" id="modalTitle">過去7日間の一言</h2>
      <div id="modalList"></div>
    </div>
  </div>

  <footer>
    <p class="motto">考えるを、ひとりにしない。</p>
    <p class="from">— YoshiBonより</p>
  </footer>
</div>

<script>
const MESSAGES = [
  // === YoshiBonより ===
  { category: "YoshiBonより", text: "今日の一歩、ちゃんと見てるよ。ロンドンの空の下で頑張るキミを、日本から誇りに思ってる。", from: "YoshiBon",
    note: "キミに勇気を届ける一言だよ。今日、不安に負けそうな瞬間があったら思い出して。", english: "I see every step you take. We're proud of you, fighting under the London sky." },
  { category: "YoshiBonより", text: "迷ったら、お客様の笑顔を思い出してごらん。それがいつも答えだ。", from: "YoshiBon",
    note: "迷う時こそ原点に立ち返ろう。キミの仕事の答えは、いつも目の前にある。", english: "When in doubt, picture your guests' smiles. The answer is always there." },
  { category: "YoshiBonより", text: "器と料理と盛り付け。人生もこの三位一体でいこう。", from: "YoshiBon",
    note: "AKIRAの哲学は、そのまま生き方の哲学になる。今日もていねいに。", english: "Tableware, food, and presentation - the trinity. Let's live our lives the same way." },
  { category: "YoshiBonより", text: "若い頃の経験は、今のキミをちゃんと支えてる。無駄な時間なんて、ひとつもなかった。", from: "YoshiBon",
    note: "過去を否定しないで。すべての経験が、今日のキミを作っている。", english: "Your past experiences are still supporting you. Not a single moment was wasted." },
  { category: "YoshiBonより", text: "考えるを、ひとりにしない。日本にはいつでも相談できる仲間がいる。忘れないでね。", from: "YoshiBon",
    note: "孤独に感じる夜こそ、誰かに話してみて。日本はいつでもキミの味方だ。", english: "Don't think alone. You have people back in Japan ready to listen. Always remember that." },
  { category: "YoshiBonより", text: "一日の終わりに、自分を褒めてあげて。今日もよく頑張ったね、って。", from: "YoshiBon",
    note: "他人より、まず自分を認めよう。それが明日への最大のエネルギーになる。", english: "At the end of each day, praise yourself. Tell yourself - you did well today." },
  { category: "YoshiBonより", text: "キミの挑戦、陰ながら本当に誇りに思っている。これは本気の本気だよ。", from: "YoshiBon",
    note: "見えない応援こそ、いちばん強い。日本からの誇り、ちゃんと受け取ってね。", english: "I'm truly proud of your challenge. I mean it from the bottom of my heart." },
  { category: "YoshiBonより", text: "お客様から ありがとう と言われた日を、ノートに書き留めておくといい。あとで宝物になるから。", from: "YoshiBon",
    note: "感謝の言葉は、未来のキミへの贈り物。1行でも残しておこう。", english: "Write down every 'thank you' you receive. They'll become treasures one day." },
  { category: "YoshiBonより", text: "焦らなくていい。ロンドンで過ごす一日一日が、キミだけの財産になっていく。", from: "YoshiBon",
    note: "成長は急がなくていい。日々の積み重ねが、いちばんの財産になる。", english: "Don't rush. Each day in London is becoming your unique treasure." },
  { category: "YoshiBonより", text: "うまくいかない日こそ、成長してる日だ。胸を張って、ゆっくり休んでいい。", from: "YoshiBon",
    note: "うまくいかない日は成長日。罪悪感なしに、ゆっくり休もう。", english: "On the hardest days, you're growing the most. Be proud, and rest well." },

  // === 今日の格言 ===
  { category: "今日の格言", text: "千里の道も一歩から。", from: "古くからの言葉",
    note: "大きな夢も、今日の一歩から始まる。焦らずに行こう。", english: "A journey of a thousand miles begins with a single step." },
  { category: "今日の格言", text: "初心忘るべからず。", from: "世阿弥",
    note: "ロンドンに渡った日の気持ちを、時々思い出してみて。", english: "Never forget the heart with which you began." },
  { category: "今日の格言", text: "失敗は成功のもと。", from: "古くからの言葉",
    note: "失敗を恐れないで。それは成功への一歩前進だよ。", english: "Failure is the foundation of success." },
  { category: "今日の格言", text: "石の上にも三年。", from: "古くからの言葉",
    note: "続ければ、必ず花は咲く。今日の苦しさは未来の宝。", english: "Even on a cold stone, three years of patience brings warmth." },
  { category: "今日の格言", text: "継続は力なり。", from: "古くからの言葉",
    note: "毎日の小さな積み重ねが、やがてキミの実力になる。", english: "Continuity itself is power." },
  { category: "今日の格言", text: "急がば回れ。", from: "古くからの言葉",
    note: "急ぐ時こそ、深呼吸して。遠回りが一番の近道。", english: "When in a hurry, take the long way around." },
  { category: "今日の格言", text: "雨降って地固まる。", from: "古くからの言葉",
    note: "つらい時を越えると、関係も心も強くなる。", english: "After the rain, the ground hardens." },
  { category: "今日の格言", text: "明日は明日の風が吹く。", from: "古くからの言葉",
    note: "今日の悩みは今日まで。明日にはまた新しい風が吹くよ。", english: "Tomorrow brings its own winds. Don't carry today's worries." },
  { category: "今日の格言", text: "為せば成る 為さねば成らぬ 何事も 成らぬは人の 為さぬなりけり。", from: "上杉鷹山",
    note: "やればできる。やらないから出来ないだけ。今日の一歩を。", english: "If you do it, it will be done. What isn't done, simply wasn't attempted." },
  { category: "今日の格言", text: "人生とは、今日一日のことである。", from: "古くからの言葉",
    note: "未来も過去もいったん置いて、今日を生き切ろう。", english: "Life is just this one day, today." },

  // === 今日の一句 ===
  { category: "今日の一句", text: "古池や 蛙飛びこむ 水の音", from: "松尾芭蕉",
    note: "静けさの中の小さな音に気づける一日を。", english: "An old pond - a frog leaps in - the sound of water." },
  { category: "今日の一句", text: "菜の花や 月は東に 日は西に", from: "与謝蕪村",
    note: "東と西、日本とロンドン。空はつながっているよ。", english: "Rapeseed flowers - the moon in the east, the sun in the west." },
  { category: "今日の一句", text: "やれ打つな 蝿が手をすり 足をする", from: "小林一茶",
    note: "小さな命にも優しさを。それがキミの強さだ。", english: "Don't swat - the fly rubs its hands, rubs its feet, pleading." },
  { category: "今日の一句", text: "閑さや 岩にしみ入る 蝉の声", from: "松尾芭蕉",
    note: "静寂と命の音。心を澄ます瞬間を、今日もどこかに。", english: "Such stillness - cicadas' cries soak into the rocks." },
  { category: "今日の一句", text: "夏草や 兵どもが 夢の跡", from: "松尾芭蕉",
    note: "強かった人々の夢の跡。キミの今日も、誰かの希望になる。", english: "Summer grass - all that remains of warriors' dreams." },
  { category: "今日の一句", text: "遠き日の 母の声聞く 春の風", from: "名もなき詠み人",
    note: "春風にお母さんの声を感じる時、キミは一人じゃない。", english: "In the spring breeze, I hear my mother's voice from long ago." },
  { category: "今日の一句", text: "異国にて 一人の夕餉 春深し", from: "名もなき詠み人",
    note: "一人の夕食も、キミの物語の大切な一場面。", english: "A solitary dinner in a foreign land, deep in spring." },
  { category: "今日の一句", text: "初夏や 異国の街に 和の薫り", from: "名もなき詠み人",
    note: "ロンドンの空気に、キミ自身が日本の薫りを運んでいる。", english: "Early summer - the scent of Japan drifts through a foreign town." },
  { category: "今日の一句", text: "霧の街 湯気の向こうに 母の顔", from: "名もなき詠み人",
    note: "霧の朝、味噌汁の湯気にお母さんの面影を。", english: "Misty city - beyond the steam, my mother's face." },
  { category: "今日の一句", text: "おもてなし 海を越えても 日の本の", from: "名もなき詠み人",
    note: "おもてなしの心は、海を越えてもキミの中で生きている。", english: "Omotenashi - even across the seas, the heart of Japan endures." },

  // === 今日のくすっと ===
  { category: "今日のくすっと", text: "今日は味噌汁の前にまず深呼吸。うん、それだ。", from: "どこかの賢人",
    note: "朝の小さな儀式が、一日を整えてくれるよ。", english: "Today, take a deep breath before the miso soup. Yes, that's the way." },
  { category: "今日のくすっと", text: "寿司を握るキミの手は、もはや芸術家の手である。たぶん。", from: "どこかの賢人",

function formatDate(d) {
  const y = d.getFullYear();
  const m = d.getMonth() + 1;
  const day = d.getDate();
  const w = ['日','月','火','水','木','金','土'][d.getDay()];
  return y + '年' + m + '月' + day + '日 ' + w + '曜日  from Japan';
}

function dayOfYear(d) {
  const start = new Date(d.getFullYear(), 0, 0);
  const diff = d - start;
  return Math.floor(diff / 86400000);
}

function getTodayIndex() {
  return dayOfYear(new Date()) % MESSAGES.length;
}

let currentIndex = null;

function showMessage(index) {
  const msg = MESSAGES[index];
  document.getElementById('categoryTag').textContent = msg.category;
  document.getElementById('messageText').textContent = msg.text;
  document.getElementById('signature').textContent = '— ' + msg.from;
  document.getElementById('noteText').textContent = msg.note || '';
  document.getElementById('engText').textContent = msg.english || '';
  // 切り替え時に展開を閉じる
  document.getElementById('noteBox').classList.remove('open');
  document.getElementById('engBox').classList.remove('open');
  document.getElementById('toggleNote').classList.remove('active');
  document.getElementById('toggleEng').classList.remove('active');
  currentIndex = index;
  updateFavButton(index);
}

function openEnvelope() {
  const env = document.getElementById('envelope');
  const letter = document.getElementById('letter');
  const actions = document.getElementById('actions');
  if (env.classList.contains('opened')) return;

  env.classList.add('opened');
  const todayIdx = getTodayIndex();
  const todayStr = new Date().toISOString().slice(0,10);
  const history = JSON.parse(localStorage.getItem('yusuke_history') || '{}');
  history[todayStr] = todayIdx;
  localStorage.setItem('yusuke_history', JSON.stringify(history));

  showMessage(todayIdx);
  setTimeout(() => {
    letter.classList.add('show');
    actions.classList.add('show');
  }, 600);
}

function toggleFav() {
  if (currentIndex === null) return;
  let favs = JSON.parse(localStorage.getItem('yusuke_favs') || '[]');
  if (favs.includes(currentIndex)) {
    favs = favs.filter(i => i !== currentIndex);
  } else {
    favs.push(currentIndex);
  }
  localStorage.setItem('yusuke_favs', JSON.stringify(favs));
  updateFavButton(currentIndex);
}

function updateFavButton(idx) {
  const btn = document.getElementById('favBtn');
  const favs = JSON.parse(localStorage.getItem('yusuke_favs') || '[]');
  if (favs.includes(idx)) {
    btn.textContent = '★ お気に入り中';
    btn.classList.add('fav-on');
  } else {
    btn.textContent = '☆ お気に入り';
    btn.classList.remove('fav-on');
  }
}

function randomMessage() {
  let idx;
  do {
    idx = Math.floor(Math.random() * MESSAGES.length);
  } while (idx === currentIndex && MESSAGES.length > 1);
  showMessage(idx);
}

function showPast() {
  const modal = document.getElementById('modal');
  const list = document.getElementById('modalList');
  document.getElementById('modalTitle').textContent = '過去7日間の一言';
  const history = JSON.parse(localStorage.getItem('yusuke_history') || '{}');
  const today = new Date();
  let html = '';
  let found = 0;

  for (let i = 0; i < 30; i++) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const key = d.toISOString().slice(0,10);
    if (history[key] !== undefined) {
      const msg = MESSAGES[history[key]];
      const label = (d.getMonth()+1) + '月' + d.getDate() + '日 / ' + msg.category;
      html += '<div class="past-item"><div class="past-date">' + label + '</div><div class="past-text">' + msg.text + '</div></div>';
      found++;
      if (found >= 7) break;
    }
  }
  if (found === 0) {
    html = '<p class="empty-note">まだ記録がないよ。<br>明日からの一言を楽しみに。</p>';
  }
  list.innerHTML = html;
  modal.classList.add('show');
}

function toggleBox(boxId, btnId) {
  const box = document.getElementById(boxId);
  const btn = document.getElementById(btnId);
  box.classList.toggle('open');
  btn.classList.toggle('active');
}

window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('date').textContent = formatDate(new Date());
  document.getElementById('envelopeWrap').addEventListener('click', openEnvelope);
  document.getElementById('favBtn').addEventListener('click', toggleFav);
  document.getElementById('randomBtn').addEventListener('click', randomMessage);
  document.getElementById('pastBtn').addEventListener('click', showPast);
  document.getElementById('toggleNote').addEventListener('click', () => toggleBox('noteBox', 'toggleNote'));
  document.getElementById('toggleEng').addEventListener('click', () => toggleBox('engBox', 'toggleEng'));
  document.getElementById('modalClose').addEventListener('click', () => {
    document.getElementById('modal').classList.remove('show');
  });
  document.getElementById('modal').addEventListener('click', (e) => {
    if (e.target.id === 'modal') {
      document.getElementById('modal').classList.remove('show');
    }
  });
});
